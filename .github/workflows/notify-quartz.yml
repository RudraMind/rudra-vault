name: Notify Quartz
on:
  push:
    branches: [master]
    paths:
      - 'wiki/**'
      - 'meta/index.md'

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DISPATCH_PAT }}
          repository: RudraMind/rudra-quartz
          event-type: vault-updated
          client-payload: '{"ref": ${{ toJSON(github.ref) }}, "sha": ${{ toJSON(github.sha) }}}'
